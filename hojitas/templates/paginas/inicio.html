{% extends "base.html" %}
{% block titulo %} Inicio {% endblock %}
{% block contenido %}
<div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
        <h1 class="display-5 fw-bold">Bienvenidos al sitio de las hojas de
            hielo</h1>
        <p class="col-md-8 fs-4">Empezar a ingresar hojas</p>
        <form action="{% url 'crear_hojita' %}" method="GET" style="display:inline;">
            {% csrf_token %}
            <button class="btn btn-primary btn-lg" type="submit">Empezar</button>
        </form>

    </div>
</div>
{% endblock %}
