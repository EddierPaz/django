
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Hojitas</title>
</head>

<body>
    {% block content %}
    <h1>Listar Hojitas</h1>
    {% for hoja in hojas %}
    <div>
        <h1>{{ hoja.id }}</h1>
        <h2>{{ hoja.name }}</h2>
        <p>Precio: {{ hoja.price }}</p>
        <img src="{{ hoja.imagen.url }}" alt="{{ hoja.name }}" width="200">
        <p>{{ hoja.description }}</p>
        <form action="{% url 'editar_hojita' hoja.id %}" method="GET" style="display:inline;">
            {% csrf_token %}
            <button type="submit">editar</button>
        </form>
        <form action="{% url 'eliminar_hojita' hoja.id %}" method="GET" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Eliminar</button>
        </form>
    </div>
    {% endfor %}
    {% endblock %}

</body>

</html>
