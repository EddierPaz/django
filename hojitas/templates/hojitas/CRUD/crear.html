{% extends "base.html" %}
{% block titulo %} Crear Hojita {% endblock %}

{% block contenido %}

<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Crear una hoja</h5>
    </div>
    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="name" name="name" required><br>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" id="price" name="price" required><br>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Descripción</label>
                <textarea class="form-control" id="description" name="description"></textarea>
            </div>
            <div class="mb-3">
                <label for="imagen" class="form-label">Imagen</label>
                <input type="file" class="form-control" id="imagen" name="imagen">
            </div>
            <button type="submit" class="btn btn-primary">Crear hojita</button>
            <a href="{% url 'lista_hojitas' %}" class="btn btn-secondary">Cancelar</a>
        </form>

    </div>
    <div class="card-footer text-muted text-center">
        footer
    </div>
</div>
{% endblock %}
