<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Hojitas</title>
</head>

<body>
    <h1>Aqui puedes crear hojitas</h1>

    <form action="{% url 'crear_hojita' %}" method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="price">Precio:</label>
        <input type="number" id="price" name="price" step="0.01" required><br>

        <label for="imagen">Imagen:</label>
        <input type="file" id="imagen" name="imagen" required><br>

        <label for="description">Descripción:</label>
        <textarea id="description" name="description"></textarea><br>

        <button type="submit">Crear Hojita</button>
    </form>
</body>

</html>
