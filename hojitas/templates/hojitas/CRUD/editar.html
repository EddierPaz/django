{% extends "base.html" %}
{% block titulo %} Agregar nuevo hoja {% endblock %}
{% block contenido %}
<div class="card">
    <div class="card-header bg bg-primary text-white">
        Editar una hoja
    </div>
    <div class="card-body">
        <h4 class="card-title">Datos de la hoja</h4>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ hojita.name }}" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ hojita.price }}"
                    required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Descripción</label>
                <textarea class="form-control" id="description" name="description">{{ hojita.description }}</textarea>
            </div>
            <div class="mb-3">
                <label for="imagen" class="form-label">Imagen</label>
                <input type="file" class="form-control" id="imagen" name="imagen">
                {% if hojita.imagen %}
                <label for="imagen" class="form-label">Imagen antigua:</label>
                <img src="{{ hojita.imagen.url }}" alt="{{ hojita.name }}" class="img-thumbnail mt-2"
                    style="max-width: 150px;">
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{% url 'lista_hojitas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <div class="card-footer text-muted">
        Footer
    </div>
</div>
{% endblock %}
